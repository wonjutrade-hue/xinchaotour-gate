<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 260" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&amp;family=Caveat:wght@700&amp;display=swap');
      .tours-text {
        font-family: 'Caveat', 'Comic Sans MS', cursive, sans-serif;
        font-size: 110px;
        font-weight: 700;
        fill: #EEA638;
      }
      .xinchao-text {
        font-family: 'Fredoka', 'Nunito', 'Arial Rounded MT Bold', sans-serif;
        font-size: 72px;
        font-weight: 700;
        fill: #2B8DE3;
        letter-spacing: 2px;
      }
    </style>
  </defs>

  <!-- Airplane Icon flying top right -->
  <g transform="translate(365, 30) rotate(-15) scale(0.95)" fill="#EEA638">
    <path d="M 0,25 C 10,23 25,18 40,5 C 43,2.5 47,0 50,0 C 53,0 52,5 50,10 C 42,25 35,35 30,42 L 52,48 C 55,49 56,52 54,54 C 52,56 49,55 46,53 L 23,45 C 17,52 10,58 3,63 C 1,64 -1,62 0,60 C 2,55 6,48 10,40 L 0,25 Z" />
  </g>

  <!-- Lotus Flower Graphic -->
  <g transform="translate(385, 95) scale(0.75)">
    <!-- Lotus Petals -->
    <path d="M20,40 Q10,20 20,0 Q30,20 20,40 Z" fill="#2B8DE3" opacity="0.9" />
    <path d="M20,40 Q0,25 0,10 Q15,15 20,40 Z" fill="#3B9AEA" opacity="0.8" />
    <path d="M20,40 Q40,25 40,10 Q25,15 20,40 Z" fill="#3B9AEA" opacity="0.8" />
    <path d="M20,40 Q-10,35 -10,20 Q10,22 20,40 Z" fill="#2B8DE3" opacity="0.7" />
    <path d="M20,40 Q50,35 50,20 Q30,22 20,40 Z" fill="#2B8DE3" opacity="0.7" />
    <!-- Lotus Stem / Base Curve -->
    <path d="M20,42 C 15,55 0,65 -20,70" stroke="#2B8DE3" stroke-width="2" fill="none" />
  </g>

  <!-- Main Brand Title: Tours -->
  <text x="30" y="135" class="tours-text" transform="rotate(-6 30 135)">Tours</text>

  <!-- Sub Brand Title: XIN CHÀO -->
  <text x="25" y="225" class="xinchao-text" transform="rotate(-5 25 225)">XIN CHÀO</text>
</svg>
